<?xml version="1.0" encoding="UTF-8"?>
<!--
  Casa Bella — Original logo
  Concept: circular emblem with house silhouette, leaf inside,
  Mexican folk-art dots around the ring and a CB monogram.
  Palette: olive #4A5340, terracotta #C68866, brass #B8964A,
           charcoal #2D2A26, warm white #FBFAF8.
-->
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Casa Bella">
  <!-- Background disc (warm white) -->
  <circle cx="100" cy="100" r="99" fill="#FBFAF8" />

  <!-- Outer olive ring -->
  <circle cx="100" cy="100" r="92" stroke="#4A5340" stroke-width="2.4" />
  <!-- Inner thin brass ring -->
  <circle cx="100" cy="100" r="85" stroke="#B8964A" stroke-width="0.8" opacity="0.55" />

  <!-- Mexican folk-art dots (12 around the ring at radius 88) -->
  <g fill="#C68866">
    <circle cx="100" cy="12" r="2.2" />
    <circle cx="144" cy="23.8" r="2.2" />
    <circle cx="176.2" cy="56" r="2.2" />
    <circle cx="188" cy="100" r="2.2" />
    <circle cx="176.2" cy="144" r="2.2" />
    <circle cx="144" cy="176.2" r="2.2" />
    <circle cx="100" cy="188" r="2.2" />
    <circle cx="56" cy="176.2" r="2.2" />
    <circle cx="23.8" cy="144" r="2.2" />
    <circle cx="12" cy="100" r="2.2" />
    <circle cx="23.8" cy="56" r="2.2" />
    <circle cx="56" cy="23.8" r="2.2" />
  </g>

  <!-- House silhouette outline -->
  <!-- Roof (triangle) -->
  <path d="M52 102 L100 62 L148 102" stroke="#4A5340" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" />
  <!-- Walls -->
  <path d="M62 98 L62 146 L138 146 L138 98" stroke="#4A5340" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" />
  <!-- Floor / ground line -->
  <line x1="58" y1="146" x2="142" y2="146" stroke="#4A5340"
        stroke-width="3.5" stroke-linecap="round" />

  <!-- Leaf inside the house (terracotta) -->
  <path d="M100 108 C 86 118 86 138 100 148 C 114 138 114 118 100 108 Z"
        fill="#C68866" />
  <!-- Central leaf vein -->
  <line x1="100" y1="112" x2="100" y2="146" stroke="#4A5340"
        stroke-width="1.4" stroke-linecap="round" />
  <!-- Side leaf veins -->
  <path d="M100 122 L92 130 M100 122 L108 130 M100 132 L93 140 M100 132 L107 140"
        stroke="#4A5340" stroke-width="0.7" stroke-linecap="round" />

  <!-- CB monogram (brass, serif) -->
  <text x="100" y="172" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
        font-size="16" font-weight="600" fill="#B8964A"
        text-anchor="middle" letter-spacing="2.4">CB</text>
  <!-- Tiny brass underline accent -->
  <line x1="86" y1="178" x2="114" y2="178" stroke="#B8964A"
        stroke-width="0.7" stroke-linecap="round" />
</svg>
